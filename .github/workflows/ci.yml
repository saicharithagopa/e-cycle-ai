name: CI

on:
  push:
    branches: [main, develop]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Compile check
        run: python -m compileall e_cycle_ai

      - name: Run test suite
        run: pytest -q

      - name: Verify Alembic migration chain
        run: alembic upgrade head && alembic downgrade base
        env:
          DATABASE_URL: sqlite:///./ci_check.db
